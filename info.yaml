# Tiny Tapeout project information
project:
  title: "Sumador Ripple Carry de 8 bits"
  author: "Jorge Saul Montes Caceres"
  discord: ""
  description: "Suma dos números de 8 bits"
  language: "Verilog"
  clock_hz: 0

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_8bitadder"

  # Source files are relative to ./src.
  # Also check PROJECT_SOURCES in test/Makefile.
  source_files:
    - "project.v"

# Pin labels for the datasheet and website.
pinout:
  # Entradas del primer operando, A
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "A4"
  ui[5]: "A5"
  ui[6]: "A6"
  ui[7]: "A7"

  # Salidas de la suma
  uo[0]: "SUM0"
  uo[1]: "SUM1"
  uo[2]: "SUM2"
  uo[3]: "SUM3"
  uo[4]: "SUM4"
  uo[5]: "SUM5"
  uo[6]: "SUM6"
  uo[7]: "SUM7"

  # Pines bidireccionales usados como entradas del segundo operando, B
  uio[0]: "B0"
  uio[1]: "B1"
  uio[2]: "B2"
  uio[3]: "B3"
  uio[4]: "B4"
  uio[5]: "B5"
  uio[6]: "B6"
  uio[7]: "B7"

# Do not change!
yaml_version: 6
